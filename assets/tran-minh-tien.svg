      <animate attributeName="opacity" values="1;0.6;1" dur="2.5s" begin="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.15;1" dur="2.5s" begin="6s" repeatCount="indefinite" additive="sum"/>
