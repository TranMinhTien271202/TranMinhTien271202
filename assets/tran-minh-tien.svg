      <animate attributeName="y" from="30" to="70" dur="0.8s" begin="2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animate attributeName="x" from="1010" to="683" dur="1.5s" begin="3.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
