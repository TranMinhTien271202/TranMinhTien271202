<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    
    <!-- Metallic gradients for each letter -->
    <linearGradient id="gold1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffed4e"/>
      <stop offset="100%" stop-color="#ffa500"/>
    </linearGradient>
    
    <linearGradient id="gold2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#ee5a6f"/>
    </linearGradient>
    
    <linearGradient id="gold3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48dbfb"/>
      <stop offset="50%" stop-color="#0abde3"/>
      <stop offset="100%" stop-color="#00d2d3"/>
    </linearGradient>
    
    <linearGradient id="gold4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9ff3"/>
      <stop offset="50%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#ff6348"/>
    </linearGradient>
    
    <linearGradient id="gold5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#54a0ff"/>
      <stop offset="50%" stop-color="#00d2d3"/>
      <stop offset="100%" stop-color="#1dd1a1"/>
    </linearGradient>
    
    <linearGradient id="gold6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#feca57"/>
      <stop offset="50%" stop-color="#ff9ff3"/>
      <stop offset="100%" stop-color="#ee5a6f"/>
    </linearGradient>
    
    <linearGradient id="gold7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1dd1a1"/>
      <stop offset="50%" stop-color="#10ac84"/>
      <stop offset="100%" stop-color="#01a3a4"/>
    </linearGradient>
    
    <linearGradient id="gold8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c44569"/>
      <stop offset="50%" stop-color="#f8b500"/>
      <stop offset="100%" stop-color="#f53b57"/>
    </linearGradient>
    
    <linearGradient id="gold9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5f27cd"/>
      <stop offset="50%" stop-color="#341f97"/>
      <stop offset="100%" stop-color="#8854d0"/>
    </linearGradient>
    
    <linearGradient id="gold10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d2d3"/>
      <stop offset="50%" stop-color="#54a0ff"/>
      <stop offset="100%" stop-color="#5f27cd"/>
    </linearGradient>
    
    <linearGradient id="gold11" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9ff3"/>
      <stop offset="50%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#48dbfb"/>
    </linearGradient>
    
    <linearGradient id="gold12" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1dd1a1"/>
      <stop offset="50%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#ee5a6f"/>
    </linearGradient>
    
    <!-- Filter for glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;800;900&display=swap');
    
    text {
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 52px;
      opacity: 0;
      font-weight: 900;
      filter: url(#glow);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
  </style>

  <!-- Background gradient -->
  <rect width="1200" height="200" fill="url(#bg)"/>

  <!-- Noise nhẹ -->
  <rect width="1200" height="200" fill="#000" opacity="0.05"/>

  <!-- Text Animation -->
  <g transform="translate(50, 65)">
    <!-- T -->
    <text x="0" y="70" fill="url(#gold1)">
      T
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0s" fill="freeze"/>
      <animate attributeName="x" from="0" to="180" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- R -->
    <text x="95" y="70" fill="url(#gold2)">
      R
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.25s" fill="freeze"/>
      <animate attributeName="x" from="95" to="228" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- A -->
    <text x="190" y="70" fill="url(#gold3)">
      A
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.5s" fill="freeze"/>
      <animate attributeName="x" from="190" to="276" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- N -->
    <text x="285" y="70" fill="url(#gold4)">
      N
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.75s" fill="freeze"/>
      <animate attributeName="x" from="285" to="324" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- M -->
    <text x="450" y="70" fill="url(#gold5)">
      M
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1s" fill="freeze"/>
      <animate attributeName="x" from="450" to="395" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- I -->
    <text x="560" y="70" fill="url(#gold6)">
      I
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.25s" fill="freeze"/>
      <animate attributeName="x" from="560" to="455" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- N -->
    <text x="640" y="70" fill="url(#gold7)">
      N
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.5s" fill="freeze"/>
      <animate attributeName="x" from="640" to="485" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- H -->
    <text x="720" y="70" fill="url(#gold8)">
      H
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.75s" fill="freeze"/>
      <animate attributeName="x" from="720" to="533" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- T -->
    <text x="850" y="70" fill="url(#gold9)">
      T
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2s" fill="freeze"/>
      <animate attributeName="x" from="850" to="605" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- I -->
    <text x="930" y="70" fill="url(#gold10)">
      I
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.25s" fill="freeze"/>
      <animate attributeName="x" from="930" to="653" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- E -->
    <text x="1010" y="70" fill="url(#gold11)">
      E
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.5s" fill="freeze"/>
      <animate attributeName="x" from="1010" to="683" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- N -->
    <text x="1090" y="70" fill="url(#gold12)">
      N
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.75s" fill="freeze"/>
      <animate attributeName="x" from="1090" to="731" dur="1s" begin="3.25s" fill="freeze"/>
    </text>
  </g>
</svg>