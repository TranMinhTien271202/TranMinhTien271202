<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120">
  <style>
    text {
      font-family: monospace;
      font-size: 52px;
      fill: #000;
      opacity: 0;
      font-weight: 700;
    }
  </style>

  <!-- T -->
  <text x="0" y="70">
    T
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0s" fill="freeze"/>
  </text>

  <!-- R -->
  <text x="70" y="70">
    R
