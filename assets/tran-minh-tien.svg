      <animate attributeName="y" from="30" to="70" dur="0.8s" begin="1.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animate attributeName="x" from="640" to="485" dur="1.5s" begin="3.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animateTransform attributeName="transform" type="rotate" from="0 666 70" to="360 666 70" dur="0.8s" begin="1.2s" fill="freeze"/>
