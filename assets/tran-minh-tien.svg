    <text x="0" y="70" fill="url(#gold1)">
      T
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0s" fill="freeze"/>
      <animate attributeName="y" from="30" to="70" dur="0.8s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animate attributeName="x" from="0" to="180" dur="1.5s" begin="3.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animateTransform attributeName="transform" type="rotate" from="0 26 70" to="360 26 70" dur="0.8s" begin="0s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="2.5s" begin="5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.15;1" dur="2.5s" begin="5s" repeatCount="indefinite" additive="sum"/>
    </text>

    <text x="95" y="70" fill="url(#gold2)">
