<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
  </defs>

  <!-- Background gradient -->
  <rect width="1200" height="200" fill="url(#bg)"/>

  <!-- Noise nhẹ -->
  <rect width="1200" height="200" fill="#000" opacity="0.05"/>

  <!-- Text Animation -->
  <g transform="translate(150, 65)">
    <style>
      text {
        font-family: monospace;
        font-size: 52px;
        fill: #fff;
        opacity: 0;
        font-weight: 700;
      }
    </style>

    <!-- T -->
    <text x="0" y="70">
      T
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0s" fill="freeze"/>
      <animate attributeName="x" from="0" to="180" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- R -->
    <text x="70" y="70">
      R
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.25s" fill="freeze"/>
      <animate attributeName="x" from="70" to="220" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- A -->
    <text x="140" y="70">
      A
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.5s" fill="freeze"/>
      <animate attributeName="x" from="140" to="260" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- N -->
    <text x="210" y="70">
      N
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.75s" fill="freeze"/>
      <animate attributeName="x" from="210" to="300" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- M -->
    <text x="350" y="70">
      M
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1s" fill="freeze"/>
      <animate attributeName="x" from="350" to="360" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- I -->
    <text x="420" y="70">
      I
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.25s" fill="freeze"/>
      <animate attributeName="x" from="420" to="400" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- N -->
    <text x="490" y="70">
      N
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.5s" fill="freeze"/>
      <animate attributeName="x" from="490" to="440" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- H -->
    <text x="560" y="70">
      H
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.75s" fill="freeze"/>
      <animate attributeName="x" from="560" to="480" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- T -->
    <text x="700" y="70">
      T
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2s" fill="freeze"/>
      <animate attributeName="x" from="700" to="540" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- I -->
    <text x="770" y="70">
      I
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.25s" fill="freeze"/>
      <animate attributeName="x" from="770" to="580" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- E -->
    <text x="840" y="70">
      E
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.5s" fill="freeze"/>
      <animate attributeName="x" from="840" to="620" dur="1s" begin="3.25s" fill="freeze"/>
    </text>

    <!-- N -->
    <text x="910" y="70">
      N
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.75s" fill="freeze"/>
      <animate attributeName="x" from="910" to="660" dur="1s" begin="3.25s" fill="freeze"/>
    </text>
  </g>
</svg>