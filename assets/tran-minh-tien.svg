<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027">
        <animate attributeName="stop-color" values="#0f2027;#2c5364;#0f2027" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#203a43">
        <animate attributeName="stop-color" values="#203a43;#0f2027;#203a43" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2c5364">
        <animate attributeName="stop-color" values="#2c5364;#203a43;#2c5364" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <linearGradient id="gold1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffed4e"/>
      <stop offset="100%" stop-color="#ffa500"/>
    </linearGradient>
    
    <linearGradient id="gold2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#ee5a6f"/>
    </linearGradient>
    
    <linearGradient id="gold3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48dbfb"/>
      <stop offset="50%" stop-color="#0abde3"/>
      <stop offset="100%" stop-color="#00d2d3"/>
    </linearGradient>
    
    <linearGradient id="gold4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9ff3"/>
      <stop offset="50%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#ff6348"/>
    </linearGradient>
    
    <linearGradient id="gold5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#54a0ff"/>
      <stop offset="50%" stop-color="#00d2d3"/>
      <stop offset="100%" stop-color="#1dd1a1"/>
    </linearGradient>
    
    <linearGradient id="gold6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#feca57"/>
      <stop offset="50%" stop-color="#ff9ff3"/>
      <stop offset="100%" stop-color="#ee5a6f"/>
    </linearGradient>
    
    <linearGradient id="gold7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1dd1a1"/>
      <stop offset="50%" stop-color="#10ac84"/>
      <stop offset="100%" stop-color="#01a3a4"/>
    </linearGradient>
    
    <linearGradient id="gold8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c44569"/>
      <stop offset="50%" stop-color="#f8b500"/>
      <stop offset="100%" stop-color="#f53b57"/>
    </linearGradient>
    
    <linearGradient id="gold9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5f27cd"/>
      <stop offset="50%" stop-color="#341f97"/>
      <stop offset="100%" stop-color="#8854d0"/>
    </linearGradient>
    
    <linearGradient id="gold10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d2d3"/>
      <stop offset="50%" stop-color="#54a0ff"/>
      <stop offset="100%" stop-color="#5f27cd"/>
    </linearGradient>
    
    <linearGradient id="gold11" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9ff3"/>
      <stop offset="50%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#48dbfb"/>
    </linearGradient>
    
    <linearGradient id="gold12" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1dd1a1"/>
      <stop offset="50%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#ee5a6f"/>
    </linearGradient>

    <radialGradient id="particle">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
