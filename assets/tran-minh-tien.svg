      <animateTransform attributeName="transform" type="rotate" from="0 575 70" to="360 575 70" dur="0.8s" begin="1s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="2.5s" begin="5.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.15;1" dur="2.5s" begin="5.5s" repeatCount="indefinite" additive="sum"/>
