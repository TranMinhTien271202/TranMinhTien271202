  <style>
    text {
      font-family: 'Arial Black', 'Arial Bold', 'Gadget', sans-serif;
      font-size: 52px;
      opacity: 0;
      font-weight: 900;
      filter: url(#glow);
    }
  </style>

  <rect width="1200" height="200" fill="url(#bg)"/>

  <!-- Ocean waves background -->
  <g opacity="0.3">
    <path d="M0,150 Q150,130 300,150 T600,150 T900,150 T1200,150 L1200,200 L0,200 Z" fill="#48dbfb">
      <animate attributeName="d" 
        values="M0,150 Q150,130 300,150 T600,150 T900,150 T1200,150 L1200,200 L0,200 Z;
                M0,150 Q150,170 300,150 T600,150 T900,150 T1200,150 L1200,200 L0,200 Z;
                M0,150 Q150,130 300,150 T600,150 T900,150 T1200,150 L1200,200 L0,200 Z"
        dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M0,165 Q200,145 400,165 T800,165 T1200,165 L1200,200 L0,200 Z" fill="#00d2d3">
      <animate attributeName="d" 
        values="M0,165 Q200,145 400,165 T800,165 T1200,165 L1200,200 L0,200 Z;
                M0,165 Q200,185 400,165 T800,165 T1200,165 L1200,200 L0,200 Z;
                M0,165 Q200,145 400,165 T800,165 T1200,165 L1200,200 L0,200 Z"
        dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M0,180 Q250,170 500,180 T1000,180 T1200,180 L1200,200 L0,200 Z" fill="#0abde3">
      <animate attributeName="d" 
        values="M0,180 Q250,170 500,180 T1000,180 T1200,180 L1200,200 L0,200 Z;
                M0,180 Q250,190 500,180 T1000,180 T1200,180 L1200,200 L0,200 Z;
                M0,180 Q250,170 500,180 T1000,180 T1200,180 L1200,200 L0,200 Z"
        dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Floating particles with movement -->
  <circle cx="80" cy="50" r="2" fill="url(#particle)">
    <animate attributeName="cy" values="50;150;50" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="80;120;80" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="150" r="3" fill="url(#particle)">
    <animate attributeName="cy" values="150;50;150" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="250;290;250" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="80" r="2" fill="url(#particle)">
    <animate attributeName="cy" values="80;180;80" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="450;490;450" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="120" r="2.5" fill="url(#particle)">
    <animate attributeName="cy" values="120;20;120" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="650;690;650" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="60" r="3" fill="url(#particle)">
    <animate attributeName="cy" values="60;160;60" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="850;890;850" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="140" r="2" fill="url(#particle)">
    <animate attributeName="cy" values="140;40;140" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="1050;1090;1050" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="7.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Sparkle particles -->
  <circle cx="200" cy="100" r="1.5" fill="#fff" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.5;3;1.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="70" r="1.5" fill="#fff" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="4s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.5;3;1.5" dur="4s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="90" r="1.5" fill="#fff" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.5;3;1.5" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

