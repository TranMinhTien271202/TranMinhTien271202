  </text>

  <!-- H -->
  <text x="560" y="70">
    H
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.75s" fill="freeze"/>
    <animate attributeName="x" from="560" to="300" dur="1s" begin="3.25s" fill="freeze"/>
  </text>

