      <animate attributeName="y" from="30" to="70" dur="0.8s" begin="1.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animate attributeName="x" from="930" to="653" dur="1.5s" begin="3.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animateTransform attributeName="transform" type="rotate" from="0 945 70" to="360 945 70" dur="0.8s" begin="1.8s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="2.5s" begin="5.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.15;1" dur="2.5s" begin="5.9s" repeatCount="indefinite" additive="sum"/>
    </text>

